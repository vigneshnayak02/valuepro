<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wishlist - Supervaluepro</title>
    <link rel="icon" type="image/jpeg" href="images/logo.jpeg">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .wishlist-container {
            max-width: 1200px;
            margin: 8rem auto 4rem;
            padding: 0 1rem;
        }

        .wishlist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .wishlist-header h2 {
            margin: 0;
        }

        .wishlist-empty {
            text-align: center;
            padding: 4rem;
            background: var(--background-light);
            border-radius: var(--border-radius);
            box-shadow: var(--card-shadow);
        }

        .dark-mode .wishlist-empty {
            background: #1a263a;
        }

        .wishlist-empty i {
            font-size: 4rem;
            color: var(--primary-color);
            margin-bottom: 1rem;
        }

        .wishlist-empty h3 {
            margin-bottom: 1rem;
        }

        .wishlist-empty p {
            color: #666;
            margin-bottom: 2rem;
        }

        .dark-mode .wishlist-empty p {
            color: #94a3b8;
        }

        .wishlist-empty .btn {
            padding: 0.8rem 2rem;
            background: var(--gradient-primary);
            color: white;
            border: none;
            border-radius: var(--border-radius);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-speed);
            text-decoration: none;
            display: inline-block;
        }

        .wishlist-empty .btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--hover-shadow);
        }
    </style>
</head>
<body class="light-mode">
    <header>
        <nav>
            <div class="logo">
                <img src="images/logo.jpeg" alt="Supervaluepro Logo" class="logo-image">
                <h1>Supervaluepro</h1>
            </div>
            <div class="nav-controls">
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="Search products...">
                    <select id="categoryFilter">
                        <option value="">All Categories</option>
                    </select>
                </div>
                <div class="nav-buttons">
                    <button id="themeToggle" class="theme-toggle">
                        <i class="fas fa-moon"></i>
                    </button>
                    <button id="wishlistBtn" class="theme-toggle">
                        <i class="fas fa-heart"></i>
                    </button>
                    <button id="profileBtn" class="theme-toggle">
                        <i class="fas fa-user"></i>
                    </button>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <div class="wishlist-container">
            <div class="wishlist-header">
                <h2>My Wishlist</h2>
            </div>
            <div id="wishlistItemsContainer" class="products-grid">
                <!-- Wishlist items will be loaded here -->
            </div>
            <div id="emptyWishlist" class="wishlist-empty" style="display: none;">
                <i class="fas fa-heart"></i>
                <h3>Your Wishlist is Empty</h3>
                <p>Looks like you haven't added any products to your wishlist yet.</p>
                <a href="index.html" class="btn">Start Shopping</a>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <div class="footer-section about">
                <h3>About Us</h3>
                <p>Your trusted source for product recommendations and reviews.</p>
            </div>
            <div class="footer-section contact">
                <h3>Connect With Us</h3>
                <div class="social-links">
                    <a href="https://www.facebook.com/tirupati.islavath" class="social-link"><i class="fab fa-facebook"></i></a>
                    <a href="#" class="social-link"><i class="fab fa-twitter"></i></a>
                    <a href="https://www.instagram.com/viddu.____?igsh=MTdhaHl2OWpjcmtncQ==" class="social-link"><i class="fab fa-instagram"></i></a>
                    <a href="#" class="social-link"><i class="fab fa-linkedin"></i></a>
                </div>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2025 supervaluepro. All rights reserved.</p>
        </div>
    </footer>

    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/wishlist.js"></script>
</body>
</html>
