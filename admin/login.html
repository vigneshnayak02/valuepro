<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — ValuePro</title>
    <link rel="icon" type="image/jpeg" href="../images/valuepro-logo.jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
            padding: 1rem;
            -webkit-font-smoothing: antialiased;
        }

        .login-wrapper {
            width: 100%;
            max-width: 420px;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-brand {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-brand .brand-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #7c3aed, #2563eb);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            box-shadow: 0 8px 32px rgba(124, 58, 237, 0.3);
        }

        .login-brand .brand-icon i {
            font-size: 1.8rem;
            color: white;
        }

        .login-brand h1 {
            color: white;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .login-brand p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
            margin-top: 0.3rem;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 2rem 1.5rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .input-group {
            position: relative;
        }

        .input-group i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.35);
            font-size: 0.95rem;
            transition: color 0.3s;
        }

        .login-form input {
            width: 100%;
            padding: 0.85rem 0.85rem 0.85rem 2.8rem;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            font-size: 0.95rem;
            color: white;
            font-family: inherit;
            transition: all 0.3s;
        }

        .login-form input::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        .login-form input:focus {
            outline: none;
            border-color: #7c3aed;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }

        .login-form input:focus+i,
        .input-group:focus-within i {
            color: #7c3aed;
        }

        .login-form button {
            width: 100%;
            padding: 0.85rem;
            background: linear-gradient(135deg, #7c3aed, #2563eb);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
            transition: all 0.3s;
            margin-top: 0.5rem;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3);
        }

        .login-form button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(124, 58, 237, 0.4);
        }

        .login-form button:active {
            transform: translateY(0);
        }

        .error-message {
            color: #f87171;
            margin-top: 0.8rem;
            text-align: center;
            display: none;
            font-size: 0.85rem;
            background: rgba(248, 113, 113, 0.1);
            padding: 0.6rem;
            border-radius: 8px;
            border: 1px solid rgba(248, 113, 113, 0.2);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: rgba(255, 255, 255, 0.4);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: rgba(255, 255, 255, 0.7);
        }

        .back-link i {
            margin-right: 0.3rem;
        }

        @media (min-width: 480px) {
            .login-container {
                padding: 2.5rem 2rem;
            }

            .login-brand h1 {
                font-size: 2rem;
            }
        }
    </style>

    <!-- Redirect already-authenticated users immediately -->
    <script>
        if (localStorage.getItem('isAdminAuthenticated') === 'true') {
            window.location.replace('panel.html');
        }
    </script>
</head>

<body>
    <div class="login-wrapper">
        <div class="login-brand">
            <div class="brand-icon">
                <i class="fas fa-shield-alt"></i>
            </div>
            <h1>Admin Panel</h1>
            <p>Sign in to manage your store</p>
        </div>

        <div class="login-container">
            <form class="login-form" id="loginForm">
                <div class="input-group">
                    <input type="email" id="email" placeholder="Admin Email" required autocomplete="username">
                    <i class="fas fa-envelope"></i>
                </div>
                <div class="input-group">
                    <input type="password" id="password" placeholder="Password" required
                        autocomplete="current-password">
                    <i class="fas fa-lock"></i>
                </div>
                <button type="submit" id="loginSubmitBtn">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
            </form>
            <p class="error-message" id="errorMessage">
                <i class="fas fa-exclamation-circle"></i> Invalid email or password
            </p>
        </div>

        <a href="../index.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Back to Store
        </a>
    </div>

    <script type="module">
        import { auth, db, ref, get, signInWithEmailAndPassword, onAuthStateChanged, signOut } from '../js/firebase-config.js';

        const ADMIN_EMAIL = 'admin@valuepro.com';

        const loginForm = document.getElementById('loginForm');
        const errorMessage = document.getElementById('errorMessage');
        const loginBtn = document.getElementById('loginSubmitBtn');
        const originalBtnContent = loginBtn.innerHTML;

        // Redirect immediately if already signed in as admin
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                if (user.email === ADMIN_EMAIL) {
                    window.location.replace('panel.html');
                    return;
                }
                const profileRef = ref(db, `users/${user.uid}/profile/role`);
                const snap = await get(profileRef);
                if (snap.exists() && snap.val() === 'admin') {
                    window.location.replace('panel.html');
                }
            }
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Show loading state
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';
            loginBtn.disabled = true;
            errorMessage.style.display = 'none';

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                if (user.email === ADMIN_EMAIL) {
                    window.location.replace('panel.html');
                    return;
                }

                const profileRef = ref(db, `users/${user.uid}/profile/role`);
                const snap = await get(profileRef);

                if (snap.exists() && snap.val() === 'admin') {
                    window.location.replace('panel.html');
                } else {
                    await signOut(auth);
                    showError('Access denied: You are not authorized as an admin.');
                    resetBtn();
                }
            } catch (error) {
                showError('Invalid email or password.');
                resetBtn();
            }
        });

        function showError(msg) {
            errorMessage.innerHTML = `<i class="fas fa-exclamation-circle"></i> ${msg}`;
            errorMessage.style.display = 'block';
            errorMessage.style.animation = 'none';
            errorMessage.offsetHeight; // trigger reflow
            errorMessage.style.animation = 'shake 0.5s ease';
        }

        function resetBtn() {
            loginBtn.innerHTML = originalBtnContent;
            loginBtn.disabled = false;
        }
    </script>
    <style>
        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-8px);
            }

            75% {
                transform: translateX(8px);
            }
        }
    </style>
</body>

</html>
