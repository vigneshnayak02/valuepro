<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Product Details — ValuePro</title>
    <meta name="description" content="View product details, prices, offers, and related products on ValuePro.">
    <link rel="icon" type="image/jpeg" href="images/logo1.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* =========================================
           Product Page — Styles
           ========================================= */
        .product-page-loader {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 60vh;
            flex-direction: column;
            gap: 1rem;
        }
        .product-page-loader .spinner {
            width: 48px; height: 48px;
            border: 4px solid rgba(124, 58, 237, 0.15);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .product-page {
            max-width: 1280px;
            margin: 80px auto 0;
            padding: 1.5rem 1rem 4rem;
        }

        /* Breadcrumb */
        .breadcrumb {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 1.5rem;
            flex-wrap: nowrap;
            overflow-x: auto;
            white-space: nowrap;
            padding-bottom: 0.5rem;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none; /* Firefox */
        }
        .breadcrumb::-webkit-scrollbar { display: none; } /* Chrome/Safari */
        .dark-mode .breadcrumb { color: #94a3b8; }
        .breadcrumb a {
            color: var(--primary-color);
            text-decoration: none;
            transition: opacity 0.2s;
        }
        .breadcrumb a:hover { opacity: 0.8; }
        .breadcrumb .separator { color: #cbd5e1; }
        .dark-mode .breadcrumb .separator { color: #475569; }

        /* Main Product Layout */
        .product-detail {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            margin-bottom: 4rem;
        }

        /* ---- Image Gallery ---- */
        .product-gallery {
            position: sticky;
            top: 90px;
            align-self: start;
        }
        .main-image-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            border-radius: 20px;
            overflow: hidden;
            background: #f8fafc;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            cursor: zoom-in;
        }
        .dark-mode .main-image-container { background: #1e293b; }
        .main-image-container img {
            width: 100%; height: 100%;
            object-fit: contain;
            transition: transform 0.5s cubic-bezier(0.25,0.46,0.45,0.94);
        }
        .main-image-container:hover img { transform: scale(1.08); }

        .gallery-nav-btn {
            position: absolute; top: 50%;
            transform: translateY(-50%);
            width: 42px; height: 42px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(6px);
            box-shadow: 0 2px 12px rgba(0,0,0,0.12);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 1rem; color: #334155;
            transition: all 0.25s;
            z-index: 5;
            opacity: 0;
        }
        .main-image-container:hover .gallery-nav-btn { opacity: 1; }
        .gallery-nav-btn:hover { background: #fff; box-shadow: 0 4px 16px rgba(0,0,0,0.18); }
        .gallery-nav-btn.prev { left: 12px; }
        .gallery-nav-btn.next { right: 12px; }
        .dark-mode .gallery-nav-btn { background: rgba(30,41,59,0.9); color: #e2e8f0; }

        .thumbnail-strip {
            display: flex; gap: 0.7rem;
            margin-top: 1rem;
            overflow-x: auto;
            padding: 0.3rem 0;
            scrollbar-width: thin;
        }
        .thumbnail-strip::-webkit-scrollbar { height: 4px; }
        .thumbnail-strip::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 4px; }
        .thumbnail {
            width: 72px; height: 72px; flex-shrink: 0;
            border-radius: 12px; overflow: hidden; cursor: pointer;
            border: 2.5px solid transparent;
            transition: all 0.25s;
            background: #f1f5f9;
        }
        .dark-mode .thumbnail { background: #1e293b; }
        .thumbnail.active { border-color: var(--primary-color); box-shadow: 0 0 0 3px rgba(124,58,237,0.2); }
        .thumbnail:hover { border-color: var(--primary-color); }
        .thumbnail img { width: 100%; height: 100%; object-fit: contain; }

        /* ---- Product Info ---- */
        .product-info-detail { display: flex; flex-direction: column; gap: 0.3rem; }
        .product-info-detail .product-brand-name {
            font-size: 0.9rem; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.8px;
            color: var(--primary-color);
            opacity: 0.85;
        }
        .product-info-detail .product-main-title {
            font-size: 1.7rem; font-weight: 700;
            line-height: 1.3;
            color: #0f172a;
            margin-bottom: 0.4rem;
        }
        .dark-mode .product-info-detail .product-main-title { color: #f1f5f9; }

        .product-rating-bar {
            display: flex; align-items: center; gap: 0.8rem;
            margin-bottom: 0.8rem;
        }
        .rating-badge {
            display: inline-flex; align-items: center; gap: 0.35rem;
            background: var(--success-color); color: #fff;
            padding: 0.3rem 0.7rem; border-radius: 6px;
            font-size: 0.85rem; font-weight: 700;
        }
        .rating-count { font-size: 0.85rem; color: #64748b; }
        .dark-mode .rating-count { color: #94a3b8; }

        .offer-tag-detail {
            display: inline-block;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #78350f; font-weight: 700;
            padding: 0.4rem 1rem; border-radius: 8px;
            font-size: 0.8rem; margin-bottom: 1rem;
            text-transform: uppercase; letter-spacing: 0.5px;
        }

        .price-block {
            background: linear-gradient(135deg, rgba(124,58,237,0.05), rgba(37,99,235,0.05));
            border-radius: 16px; padding: 1.2rem 1.5rem;
            margin-bottom: 1.2rem;
            border: 1px solid rgba(124,58,237,0.1);
        }
        .dark-mode .price-block {
            background: linear-gradient(135deg, rgba(124,58,237,0.1), rgba(37,99,235,0.1));
            border-color: rgba(124,58,237,0.2);
        }
        .price-block .current-price {
            font-size: 2rem; font-weight: 800;
            color: var(--primary-color);
        }
        .price-block .original-price-detail {
            font-size: 1.1rem; color: #94a3b8;
            text-decoration: line-through;
            margin-left: 0.8rem;
        }
        .price-block .discount-badge {
            display: inline-block;
            background: rgba(16,185,129,0.12);
            color: var(--success-color); font-weight: 700;
            padding: 0.25rem 0.7rem; border-radius: 6px;
            font-size: 0.85rem; margin-left: 0.8rem;
        }
        .price-block .price-row { display: flex; align-items: baseline; flex-wrap: wrap; }

        .delivery-badge {
            display: inline-flex; align-items: center; gap: 0.5rem;
            background: rgba(16,185,129,0.08);
            color: var(--success-color);
            padding: 0.5rem 1rem; border-radius: 10px;
            font-size: 0.88rem; font-weight: 500;
            margin-bottom: 1.2rem;
        }
        .dark-mode .delivery-badge { background: rgba(16,185,129,0.15); }

        .product-description-block {
            margin-bottom: 1.5rem;
        }
        .product-description-block h3 {
            font-size: 1rem; font-weight: 700;
            margin-bottom: 0.6rem; color: #334155;
        }
        .dark-mode .product-description-block h3 { color: #e2e8f0; }
        .product-description-block p {
            font-size: 0.95rem; line-height: 1.8;
            color: #475569;
            white-space: pre-line;
        }
        .dark-mode .product-description-block p { color: #94a3b8; }

        /* Action Buttons */
        .product-actions {
            display: flex; gap: 1rem;
            margin-top: 0.5rem;
            flex-wrap: wrap;
        }
        .product-actions .action-btn {
            flex: 1; min-width: 160px;
            display: flex; align-items: center; justify-content: center;
            gap: 0.6rem;
            padding: 1rem 1.5rem;
            border-radius: 14px; border: none;
            font-size: 1rem; font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25,0.46,0.45,0.94);
            text-decoration: none;
        }
        .action-btn.buy-now {
            background: var(--gradient-primary);
            color: #fff;
            box-shadow: 0 4px 15px rgba(124,58,237,0.3);
        }
        .action-btn.buy-now:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(124,58,237,0.4);
        }
        .action-btn.whatsapp-action {
            background: linear-gradient(135deg, #25d366, #128c7e);
            color: #fff;
            box-shadow: 0 4px 15px rgba(37,211,102,0.3);
        }
        .action-btn.whatsapp-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(37,211,102,0.4);
        }
        .action-btn.wishlist-action {
            background: transparent;
            border: 2px solid rgba(124,58,237,0.3);
            color: var(--primary-color);
            flex: 0;
            min-width: 56px; width: 56px; height: 56px;
            padding: 0;
            border-radius: 14px;
        }
        .action-btn.wishlist-action:hover {
            background: rgba(124,58,237,0.06);
            border-color: var(--primary-color);
        }
        .action-btn.wishlist-action.wishlisted { color: #ef4444; border-color: rgba(239,68,68,0.3); }
        .action-btn.wishlist-action.wishlisted i { animation: heartPop 0.3s ease; }
        @keyframes heartPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        .share-btn {
            background: transparent;
            border: 2px solid rgba(0,0,0,0.08);
            color: #64748b;
            flex: 0; min-width: 56px; width: 56px; height: 56px;
            padding: 0; border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; cursor: pointer;
            transition: all 0.2s;
        }
        .dark-mode .share-btn { border-color: rgba(255,255,255,0.1); color: #94a3b8; }
        .share-btn:hover { background: rgba(0,0,0,0.04); color: var(--primary-color); }

        /* ---- Related Products ---- */
        .related-section {
            margin-top: 3rem;
        }
        .related-section .section-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 1.5rem;
        }
        .related-section .section-header h2 {
            font-size: 1.5rem; font-weight: 700;
            color: #0f172a;
        }
        .dark-mode .related-section .section-header h2 { color: #f1f5f9; }
        .related-nav-btns { display: flex; gap: 0.5rem; }
        .related-nav-btn {
            width: 40px; height: 40px;
            border-radius: 50%; border: 1.5px solid rgba(0,0,0,0.1);
            background: #fff; color: #334155;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 0.95rem;
            transition: all 0.2s;
        }
        .dark-mode .related-nav-btn { background: #1e293b; border-color: rgba(255,255,255,0.1); color: #e2e8f0; }
        .related-nav-btn:hover { background: var(--primary-color); color: #fff; border-color: var(--primary-color); }

        .related-products-track-wrapper {
            overflow: hidden;
            position: relative;
        }
        .related-products-track {
            display: flex;
            gap: 1rem;
            overflow-x: auto;
            scrollbar-width: none; /* Firefox */
            -webkit-overflow-scrolling: touch;
            cursor: grab;
        }
        .related-products-track::-webkit-scrollbar {
            display: none;
        }
        .related-products-track:active {
            cursor: grabbing;
        }
        .related-products-track .product-card {
            min-width: 220px;
            max-width: 220px;
            flex-shrink: 0;
            user-select: none; /* Prevent text selection while dragging */
        }

        /* ---- Product Not Found ---- */
        .product-not-found {
            text-align: center;
            padding: 4rem 1rem;
        }
        .product-not-found i { font-size: 4rem; color: #cbd5e1; margin-bottom: 1rem; }
        .product-not-found h2 { font-size: 1.5rem; color: #334155; margin-bottom: 0.5rem; }
        .dark-mode .product-not-found h2 { color: #e2e8f0; }
        .product-not-found p { color: #64748b; margin-bottom: 1.5rem; }
        .product-not-found a {
            display: inline-flex; align-items: center; gap: 0.5rem;
            background: var(--gradient-primary); color: #fff;
            padding: 0.8rem 2rem; border-radius: 12px;
            text-decoration: none; font-weight: 600;
            transition: all 0.3s;
        }
        .product-not-found a:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(124,58,237,0.3); }

        /* ---- Responsive ---- */
        @media (max-width: 768px) {
            .product-page {
                margin-top: 130px;
            }
            .nav-buttons #wishlistBtn {
                display: flex !important;
            }
            .product-detail {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
            .product-gallery {
                position: static;
            }
            .product-info-detail .product-main-title {
                font-size: 1.3rem;
            }
            .price-block .current-price { font-size: 1.6rem; }
            .product-actions { 
                display: flex;
                flex-wrap: nowrap;
                align-items: center;
                gap: 0.5rem;
            }
            .action-btn.buy-now,
            .action-btn.whatsapp-action {
                flex: 1;
                min-width: 0;
            }
            .action-btn.wishlist-action,
            .action-btn.share-btn {
                flex: 0 0 auto;
                width: 48px;
                padding: 0;
            }
            .related-products-track .product-card {
                min-width: 170px;
                max-width: 170px;
            }
        }

        /* Zoom overlay */
        .image-zoom-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            display: flex; align-items: center; justify-content: center;
            cursor: zoom-out;
            animation: fadeIn 0.25s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .image-zoom-overlay img {
            max-width: 90vw; max-height: 90vh;
            object-fit: contain;
            border-radius: 8px;
        }
        .image-zoom-overlay .close-zoom {
            position: absolute; top: 1rem; right: 1.5rem;
            background: rgba(255,255,255,0.15);
            border: none; color: #fff;
            width: 44px; height: 44px; border-radius: 50%;
            font-size: 1.2rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.2s;
        }
        .image-zoom-overlay .close-zoom:hover { background: rgba(255,255,255,0.3); }

        /* Back to top */
        .back-to-store {
            position: fixed; bottom: 1.5rem; right: 1.5rem;
            background: var(--gradient-primary);
            color: #fff; border: none;
            width: 48px; height: 48px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; cursor: pointer;
            box-shadow: 0 4px 15px rgba(124,58,237,0.35);
            transition: all 0.3s; z-index: 50;
            text-decoration: none;
        }
        .back-to-store:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(124,58,237,0.45); }
    </style>
</head>
<body class="light-mode">
    <!-- Minimal Header -->
    <header>
        <nav>
            <div class="logo">
                <a href="index.html" style="display: flex; align-items: center; gap: 0.6rem; text-decoration: none; color: inherit;">
                    <img src="images/logo.png" alt="Supervaluepro Logo" class="logo-image">
                    <h1>value products</h1>
                </a>
            </div>
            <div class="nav-controls">
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="Search products...">
                    <select id="categoryFilter">
                        <option value="">All Categories</option>
                    </select>
                </div>
                <div class="nav-buttons">
                    <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">
                        <i class="fas fa-moon"></i>
                    </button>
                    <button id="wishlistBtn" class="theme-toggle" aria-label="Wishlist">
                        <i class="fas fa-heart"></i>
                        <span class="wishlist-count">0</span>
                    </button>
                </div>
            </div>
        </nav>
    </header>

    <!-- Product Page Content -->
    <main class="product-page" id="productPage">
        <!-- Populated by JS -->
        <div class="product-page-loader" id="pageLoader" style="display: block; width: 100%;">
            <div class="skeleton-breadcrumb" style="height: 20px; width: 60%; background: rgba(0,0,0,0.05); border-radius: 4px; margin-bottom: 1.5rem; animation: pulse 1.5s infinite;"></div>
            <div class="product-detail">
                <div class="product-gallery">
                    <div class="skeleton-image" style="width: 100%; aspect-ratio: 1; background: rgba(0,0,0,0.05); border-radius: 20px; animation: pulse 1.5s infinite;"></div>
                </div>
                <div class="product-info-detail">
                    <div class="skeleton-text" style="height: 36px; width: 80%; background: rgba(0,0,0,0.05); border-radius: 8px; margin-bottom: 1rem; animation: pulse 1.5s infinite;"></div>
                    <div class="skeleton-text" style="height: 24px; width: 40%; background: rgba(0,0,0,0.05); border-radius: 6px; margin-bottom: 1.5rem; animation: pulse 1.5s infinite;"></div>
                    <div class="skeleton-text" style="height: 100px; width: 100%; background: rgba(0,0,0,0.05); border-radius: 16px; margin-bottom: 1.5rem; animation: pulse 1.5s infinite;"></div>
                    <div class="skeleton-text" style="height: 60px; width: 100%; background: rgba(0,0,0,0.05); border-radius: 14px; animation: pulse 1.5s infinite;"></div>
                </div>
            </div>
            <style>
                @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
                .dark-mode .skeleton-breadcrumb, .dark-mode .skeleton-image, .dark-mode .skeleton-text { background: rgba(255,255,255,0.05) !important; }
            </style>
        </div>
    </main>

    <!-- Floating Back to Store -->
    <a href="index.html" class="back-to-store" title="Back to Store">
        <i class="fas fa-store"></i>
    </a>

    <script type="module" src="js/product-page.js"></script>
</body>
</html>
